<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYS · A2 — Editorial Features · Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; font-family: 'JetBrains Mono', monospace; background: #101010; color: #f5f5f5; }
* { box-sizing: border-box; }
body { margin: 0; }
.review-header { min-height: 88px; padding: 18px 28px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid #383733; }
.review-brand { font-size: 14px; font-weight: 600; color: #dcc09c; }
.review-title { font-size: 14px; }
.review-scope { margin-left: auto; color: #aaa69f; font-size: 12px; white-space: nowrap; }
.open-page { font-size: 12px; color: #dcc09c; text-decoration: none; white-space: nowrap; }
.open-page:focus-visible { outline: 2px solid #dcc09c; outline-offset: 6px; }
.viewport-area { height: calc(100dvh - 88px); min-height: 400px; padding: 24px; overflow: auto; }
.viewport-anchor { margin-inline: auto; }
.viewport { width: 1440px; height: 900px; transform-origin: top left; outline: 1px solid #383733; background: #171717; box-shadow: 0 12px 32px #0004; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header class="review-header">
  <span class="review-brand">BUILD YOUR STORE</span>
  <span class="review-title">A2 — Editorial Features</span>
  <span class="review-scope">Десктоп · 1440px</span>
  <a class="open-page" href="concept-a2.html" target="_blank" rel="noopener">Відкрити сторінку ↗</a>
</header>
<main class="viewport-area" aria-label="Десктопне прев’ю концепту A2">
  <div class="viewport-anchor"><div class="viewport">
    <iframe id="preview" src="concept-a2.html" title="A2 — Editorial Features · Desktop 1440px"></iframe>
  </div></div>
</main>
<script>
// Scale the preview shell; the landing itself always receives a desktop viewport.
const area = document.querySelector('.viewport-area');
const anchor = document.querySelector('.viewport-anchor');
const viewport = document.querySelector('.viewport');
function fitDesktop() {
  const scale = Math.min(1, Math.max(1, area.clientWidth - 48) / 1440);
  const height = Math.max(600, Math.floor((area.clientHeight - 48) / scale));
  viewport.style.height = `${height}px`;
  viewport.style.transform = `scale(${scale})`;
  anchor.style.width = `${1440 * scale}px`;
  anchor.style.height = `${height * scale}px`;
}
new ResizeObserver(fitDesktop).observe(area);
fitDesktop();
if (location.search) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
